[package]
name = "anydoc-ocr"
version = "0.1.0"
edition = "2024"

[dependencies]
# 版本按 spec 风险 #13 精确锁定（上游 API 变动风险）
anydoc = "=0.1.7"
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
image = "0.25.10"
# 末页表探针零拷贝映射（T11）：已由 fontdb 传递引入，提升为直接依赖不增编译单元
memmap2 = "0.9.11"
oar-ocr = { version = "=0.9.1", default-features = false, features = ["auto-download", "simd"] }
# 直接依赖 ort（与 oar-ocr-core 锁定的 =2.0.0-rc.13 同版本、特性完全镜像），
# 仅为拿到进程级线程池 API（A：消除 rayon×ORT 线程超额订阅）。特性与上游一致，
# Cargo 自动合一、不引入第二份、不改链接行为（仍走 ORT_LIB_PATH）。
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "copy-dylibs"] }
ofd-core = "=0.3.0"
pdf-inspector = "=0.1.7"
pdfium-render = "0.9.3"
rayon = "1.12.0"
tempfile = "3.27.0"
zip = "2"

[profile.release]
# 跨 crate 内联 + 更小代码，hot 路径（OCR 预处理/SIMD）收益明显。
lto = true
codegen-units = 1
# 保留符号便于 perf 火焰图定位热点（可选）。
# debug = 1
