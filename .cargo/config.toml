# 编译期优化（Ticket C）
#
# 仅对飞腾/ARM64 部署目标生效，不破坏 x86_64 本机构建。
# - target-cpu=cortex-a72：FTC663(飞腾 D2000) ≈ Cortex-A72 微架构，改善调度/指令选择。
#   注意飞腾是 ARMv8.0-A，NEON 本就默认开启；勿加 +dotprod/+fp16（v8.0 不支持，会崩/错）。
# - +neon 显式声明，防被误关。
# 链接所需的 ORT/PDFIUM 库路径由构建环境 export（见 .scratch 构建说明），不在此硬编码。

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=cortex-a72", "-C", "target-feature=+neon"]
