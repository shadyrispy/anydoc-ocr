# 编译期优化（Ticket C）
#
# 仅对飞腾/ARM64 部署目标生效，不破坏 x86_64 本机构建。
# - target-cpu=cortex-a72：FTC663(飞腾 D2000) ≈ Cortex-A72 微架构，改善调度/指令选择。
#   注意飞腾是 ARMv8.0-A，NEON 本就默认开启；勿加 +dotprod/+fp16（v8.0 不支持，会崩/错）。
# - +neon 显式声明，防被误关。
# - link-arg=-Wl,-rpath,$ORIGIN/lib：打包产物运行时相对自身 lib/ 目录加载 ORT/PDFIUM 原生库。
#   ⚠️ 必须放在此处而非 RUSTFLAGS 环境变量：设了 RUSTFLAGS 会整体覆盖本配置（target-cpu/+neon
#   静默丢失，实测确认）。构建脚本内严禁再 export RUSTFLAGS。
# 链接期 ORT/PDFIUM 的库搜索路径仍由构建环境 export（ORT_LIB_LOCATION 等），不在此硬编码。

[target.aarch64-unknown-linux-gnu]
rustflags = [
  "-C", "target-cpu=cortex-a72",
  "-C", "target-feature=+neon",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/lib",
]
